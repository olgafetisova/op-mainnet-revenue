[project]
name = "op-mainnet-revenue"
version = "0.1.0"
description = "OP Mainnet revenue diagnosis, customers, and growth recommendation"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.10",
    "plotly>=5.24",
    "kaleido>=0.2.1",
    "jupyter>=1.1",
    "nbconvert>=7.16",
    "ipykernel>=6.29",
    "requests>=2.32",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
